[tool.refurb]
ignore = [109, 112, 113, 126, 129, 184]

[tool.ruff.lint.per-file-ignores]
"rust/*/__init__.py" = ["F403", "F405"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::foundry.game.gfx.objects.in_level.object_renderer.LevelObjectRenderWarning"]

[tool.isort]
profile = "black"

[tool.black]
line-length=120

[tool.mypy]
mypy_path = [
    "./rust/rsmb3parse/stubs",
    "./rust/rtest/stubs",
    "./rust/r6502/"
]
# imports foundry leading to type errors, since only an example folder, consider it a lawless zone
exclude="smb3parse.util.parser.example"
check_untyped_defs = true
no_site_packages=true

[[tool.mypy.overrides]]
module = "py65.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module="PySide6.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module="pytest.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module="hypothesis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module="qdarkstyle"
ignore_missing_imports = true
